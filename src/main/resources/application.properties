spring.application.name=nova-nest-backend
# Force prod profile by default for Railway
spring.profiles.active=prod

# Common JPA settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Common Secrets using Environment Variables (Production) with defaults
app.jwt.secret=${JWT_SECRET:LocalDevSecretKeyForJwtAuthentication123456789}
app.jwt.expiration=${JWT_EXPIRATION:86400000}

# Email Provider (Resend API)
RESEND_API_KEY=${RESEND_API_KEY:}
MAIL_FROM=${MAIL_FROM:}

razorpay.key.id=${RAZORPAY_KEY_ID:rzp_test_dummy}
razorpay.key.secret=${RAZORPAY_KEY_SECRET:dummy}

