# Railway explicit PORT
server.port=${PORT:8080}

# Railway MySQL environment variables from the user's configuration:
# DB_HOST, DB_PORT, DB_NAME, DB_USERNAME, DB_PASSWORD
# Note: No defaults here. If variables are missing, Spring will fail to start.
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Explicitly set MySQL Dialect to avoid "Unable to determine dialect without JDBC metadata"
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update

# We inherit other common properties (JWT, Mail, Razorpay) from application.properties
